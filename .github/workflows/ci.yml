name: CI

# No-op comment: keep this workflow eligible to run on the fork.
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
    inputs:
      regional_diagnostics:
        description: Run extended regional hooks, renderer and 20-visit stress checks
        type: boolean
        default: false

# A newer push supersedes an older run of this workflow on the same ref.
# PR refs remain separate from branch pushes, as do manual and automatic runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_parser
      - name: Cache game data
        id: game-data
        uses: actions/cache@v4
        with:
          path: |
            game_data/generated
            map/static/map/icons
          key: game-data-v3
      - name: Fetch game data
        # sav_core embeds game_data/generated/{docs,world}/*.json at compile
        # time, and NOTHING generated is committed, so this archive is the only
        # way CI gets a compilable tree. game-data-v3 is the first archive built
        # after the generated/{docs,world}/ split -- v2 predates it and carries
        # no world/ tables (they used to be committed under game_data/sav_data/).
        if: steps.game-data.outputs.cache-hit != 'true'
        run: |
          wget -q -O game_data.zip https://github.com/valentinps/satisfactorymap/releases/download/game-data-v3/game_data.zip
          python3 game_data/package_game_data.py unpack game_data.zip
      - name: Cache test saves
        uses: actions/cache@v4
        with:
          path: map/uploads
          key: test-saves-v2
      - name: Fetch test saves
        run: python3 tools/fetch_test_saves.py
      - name: cargo test (release)
        run: cargo test -p sav_core --release
        working-directory: rust_parser

  wasm-build:
    name: WASM and frontend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_parser
      - name: Cache game data
        id: game-data
        uses: actions/cache@v4
        with:
          path: |
            game_data/generated
            map/static/map/icons
          key: game-data-v3
      - name: Fetch game data
        if: steps.game-data.outputs.cache-hit != 'true'
        run: |
          wget -q -O game_data.zip https://github.com/valentinps/satisfactorymap/releases/download/game-data-v3/game_data.zip
          python3 game_data/package_game_data.py unpack game_data.zip
      - name: Cache test saves
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: map/uploads
          key: test-saves-v2
      - name: Fetch test saves
        if: github.event_name != 'pull_request'
        run: python3 tools/fetch_test_saves.py
      - name: Install build dependencies
        run: python3 -m pip install -r requirements-build.txt
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build deployable site (includes WASM)
        run: python3 tools/build_site.py
      - name: Check regional decoder
        run: node tools/check_regional_wire.mjs
      - name: Check regional static resources
        run: python3 tools/check_regional_assets.py
      - name: Install browser test dependencies
        if: github.event_name != 'pull_request'
        run: python3 -m pip install -r requirements.txt
      - name: Check daily browser UI behavior
        if: github.event_name != 'pull_request'
        # GitHub's ubuntu-latest x64 image includes Chrome; ui_behaviour.py
        # launches the system browser with channel="chrome". Keep the normal
        # post-merge/manual guard focused on the shell and essential 3D journey.
        run: python3 tools/ui_behaviour.py --serve --suite shell 3d
      - name: Check extended regional browser diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.regional_diagnostics
        # Opt in from Run workflow; reuse the site build and dependencies above.
        run: python3 tools/ui_behaviour.py --serve --suite hooks renderer stress
